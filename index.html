		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			:root {
				--cream: #fefacd;
				--cream2: #fdf6b2;
				--green: #2e7d32;
				--green-light: #4caf50;
				--green-pale: #c8e6c9;
				--dark: #1c1c1c;
				--mid: #444;
				--muted: #777;
				--white: #ffffff;
				--radius: 20px;
			}

			html {
				font-size: 16px;
			}

			body {
				background: var(--cream);
				font-family: "Inter", sans-serif;
				color: var(--dark);
				min-height: 100vh;
				display: flex;
				align-items: flex-start;
				justify-content: center;
				padding: 0 0 48px 0;
				overflow-x: hidden;
				position: relative;
			}

			/* Organic blobs — exact Suphal style */
			.blob {
				position: fixed;
				border-radius: 50%;
				pointer-events: none;
				z-index: 0;
			}
			.blob-tl {
				width: 280px;
				height: 280px;
				background: var(--cream2);
				top: -80px;
				left: -80px;
				opacity: 0.9;
			}
			.blob-tr {
				width: 220px;
				height: 220px;
				background: var(--cream2);
				top: -60px;
				right: -60px;
				opacity: 0.8;
			}
			.blob-br {
				width: 320px;
				height: 320px;
				background: var(--green-pale);
				bottom: -80px;
				right: -80px;
				opacity: 0.55;
			}
			.blob-bl {
				width: 180px;
				height: 180px;
				background: var(--cream2);
				bottom: 60px;
				left: -60px;
				opacity: 0.7;
			}

			/* Page container */
			.page {
				position: relative;
				z-index: 1;
				width: 100%;
				max-width: 500px;
				padding: 0 20px;
			}

			/* Header */
			.header {
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 32px 0 8px;
			}
			.logo {
				height: 64px;
				width: auto;
				/* logo has black bg, so we invert to match cream background */
				/* filter: brightness(0) saturate(100%) invert(14%) sepia(12%) saturate(500%) hue-rotate(80deg) brightness(90%); */
			}

			/* Hero text */
			.hero {
				text-align: center;
				padding: 4px 0 24px;
			}
			.hero h1 {
				font-size: clamp(1.55rem, 5vw, 2rem);
				font-weight: 800;
				line-height: 1.2;
				color: var(--dark);
				margin-bottom: 8px;
			}
			.hero h1 .accent {
				color: var(--green);
			}
			.hero p {
				font-size: 0.88rem;
				color: var(--muted);
				line-height: 1.6;
			}

			/* Trust badges */
			.trust-row {
				display: flex;
				justify-content: center;
				gap: 8px;
				flex-wrap: wrap;
				margin-bottom: 24px;
			}
			.trust-badge {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				background: var(--green);
				color: var(--white);
				font-size: 0.7rem;
				font-weight: 600;
				padding: 5px 12px;
				border-radius: 100px;
				letter-spacing: 0.2px;
			}
			.trust-badge svg {
				flex-shrink: 0;
			}

			/* Section label */
			.section-label {
				font-size: 0.68rem;
				font-weight: 700;
				letter-spacing: 1.8px;
				text-transform: uppercase;
				color: var(--muted);
				margin-bottom: 10px;
				padding-left: 2px;
			}

			/* Variety cards */
			.varieties {
				display: flex;
				flex-direction: column;
				gap: 10px;
				margin-bottom: 20px;
			}

			.variety-card {
				background: var(--white);
				border-radius: 16px;
				border: 1.5px solid rgba(0, 0, 0, 0.07);
				padding: 14px 16px;
				display: flex;
				align-items: center;
				gap: 12px;
				transition:
					border-color 0.2s,
					box-shadow 0.2s;
				box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
			}
			.variety-card.has-qty {
				border-color: var(--green);
				box-shadow: 0 2px 12px rgba(46, 125, 50, 0.15);
			}

			.variety-info {
				flex: 1;
				min-width: 0;
			}
			.variety-name {
				font-size: 0.95rem;
				font-weight: 700;
				color: var(--dark);
				display: block;
			}
			.variety-sub {
				font-size: 0.72rem;
				color: var(--muted);
				font-weight: 500;
				display: block;
				margin-top: 1px;
			}

			/* Qty stepper */
			.qty-control {
				display: flex;
				align-items: center;
				gap: 6px;
				flex-shrink: 0;
			}
			.qty-btn {
				width: 32px;
				height: 32px;
				border-radius: 50%;
				border: 1.5px solid var(--green);
				background: transparent;
				color: var(--green);
				font-size: 1.15rem;
				font-weight: 700;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				transition:
					background 0.15s,
					color 0.15s,
					transform 0.1s;
				line-height: 1;
				flex-shrink: 0;
				-webkit-tap-highlight-color: transparent;
			}
			.qty-btn:hover,
			.qty-btn:focus {
				background: var(--green);
				color: var(--white);
				outline: none;
			}
			.qty-btn:active {
				transform: scale(0.88);
			}

			.qty-display {
				min-width: 46px;
				text-align: center;
				font-size: 0.88rem;
				font-weight: 700;
				color: var(--dark);
				line-height: 1.1;
			}
			.qty-display .unit {
				display: block;
				font-size: 0.65rem;
				font-weight: 500;
				color: var(--muted);
			}

			/* Order summary */
			.order-summary {
				background: var(--white);
				border: 1.5px solid var(--green);
				border-radius: 16px;
				padding: 14px 16px;
				margin-bottom: 16px;
				display: none;
				box-shadow: 0 2px 12px rgba(46, 125, 50, 0.1);
			}
			.order-summary.visible {
				display: block;
			}
			.summary-title {
				font-size: 0.68rem;
				font-weight: 700;
				letter-spacing: 1.5px;
				text-transform: uppercase;
				color: var(--green);
				margin-bottom: 8px;
			}
			.summary-items {
				display: flex;
				flex-direction: column;
				gap: 4px;
			}
			.summary-row {
				display: flex;
				justify-content: space-between;
				font-size: 0.85rem;
				color: var(--dark);
			}
			.summary-row span:last-child {
				font-weight: 700;
			}
			.summary-divider {
				height: 1px;
				background: rgba(0, 0, 0, 0.07);
				margin: 8px 0;
			}
			.summary-total {
				display: flex;
				justify-content: space-between;
				font-size: 0.9rem;
				font-weight: 800;
				color: var(--green);
			}

			/* WhatsApp button */
			.wa-btn {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 10px;
				width: 100%;
				background: #25d366;
				color: var(--white);
				border: none;
				border-radius: 14px;
				padding: 16px 24px;
				font-family: "Inter", sans-serif;
				font-size: 1rem;
				font-weight: 700;
				cursor: pointer;
				text-decoration: none;
				box-shadow: 0 4px 20px rgba(37, 211, 102, 0.35);
				transition:
					transform 0.15s,
					box-shadow 0.15s,
					background 0.15s;
				-webkit-tap-highlight-color: transparent;
				letter-spacing: 0.1px;
			}
			.wa-btn:hover {
				background: #1ebe5a;
				box-shadow: 0 8px 28px rgba(37, 211, 102, 0.45);
				transform: translateY(-2px);
			}
			.wa-btn:active {
				transform: scale(0.98);
			}

			/* Footer note */
			.footer-note {
				text-align: center;
				font-size: 0.72rem;
				color: var(--muted);
				margin-top: 16px;
				line-height: 1.5;
			}
			.footer-note strong {
				color: var(--dark);
			}
		</style>
	</head>

		<script>
			const varieties = [
				{ name: "Mallika", sub: "Hybrid · Neelum × Dasheri · Citrus & Honey" },
				{ name: "Benishan", sub: "Banganapalli · Sweet, Buttery, Fiberless" },
				{ name: "Kesari", sub: "Classic variety · Rich & Aromatic" },
				{ name: "Tothapari", sub: "Firm & Tangy · Great for juices" },
				{ name: "Himayath", sub: "Imam Pasand · Intensely Sweet, Premium" },
			];

			const qty = {};
			varieties.forEach((v) => (qty[v.name] = 0));

			const container = document.getElementById("varieties");
			varieties.forEach((v) => {
				const card = document.createElement("div");
				card.className = "variety-card";
				card.id = "card-" + v.name;
				card.innerHTML = `
      <div class="variety-info">
        <span class="variety-name">${v.name}</span>
      </div>
      <div class="qty-control">
        <button class="qty-btn" onclick="change('${v.name}', -1)" aria-label="Decrease">−</button>
        <div class="qty-display" id="qty-${v.name}">0<span class="unit">kg</span></div>
        <button class="qty-btn" onclick="change('${v.name}', +1)" aria-label="Increase">+</button>
      </div>`;
				container.appendChild(card);
			});

			function change(name, delta) {
				qty[name] = Math.max(0, qty[name] + delta);
				const el = document.getElementById("qty-" + name);
				el.innerHTML = qty[name] + '<span class="unit">kg</span>';
				document
					.getElementById("card-" + name)
					.classList.toggle("has-qty", qty[name] > 0);
				updateSummary();
			}

			function updateSummary() {
				const selected = varieties.filter((v) => qty[v.name] > 0);
				const summary = document.getElementById("summary");
				const items = document.getElementById("summaryItems");
				const totalEl = document.getElementById("summaryTotal");
				const btnText = document.getElementById("btnText");

				if (!selected.length) {
					summary.classList.remove("visible");
					btnText.textContent = "Order on WhatsApp";
					return;
				}

				const total = selected.reduce((s, v) => s + qty[v.name], 0);
				items.innerHTML = selected
					.map(
						(v) =>
							`<div class="summary-row"><span>${v.name}</span><span>${qty[v.name]} kg</span></div>`,
					)
					.join("");
				totalEl.textContent = total + " kg";
				summary.classList.add("visible");
				btnText.textContent = `Send Order · ${total} kg`;
			}

			function openWhatsApp() {
				const selected = varieties.filter((v) => qty[v.name] > 0);
				const message = selected.length
					? `Hi! I'd like to order fresh mangoes from Suphal 🥭\n\n` +
						selected.map((v) => `• ${v.name}: ${qty[v.name]} kg`).join("\n") +
						`\n\nPlease confirm availability and pricing. Thank you!`
					: `Hi! I'm interested in ordering fresh mangoes from Suphal 🥭 Could you share varieties and pricing?`;
				const encoded = encodeURIComponent(message);
			const phone = "918373028111";
			if (/android/i.test(navigator.userAgent)) {
				window.location.href =
					"intent://send?phone=" + phone + "&text=" + encoded +
					"#Intent;scheme=whatsapp;package=com.whatsapp;" +
					"S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.whatsapp;end";
			} else {
				window.location.href = "https://wa.me/" + phone + "?text=" + encoded;
			}
			}
		</script>
	</body>
</html>
